name: Verify education banks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/general/**'
      - 'scripts/validate-education-banks.mjs'
      - 'scripts/test-education-engine.mjs'
      - '.github/workflows/expand-education-banks.yml'

permissions:
  contents: read

concurrency:
  group: education-bank-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate 20-question banks
        run: node scripts/validate-education-banks.mjs

      - name: Validate education selection contract
        run: node scripts/test-education-engine.mjs

      - name: Validate catalog
        run: npm run validate:catalog

      - name: Build
        run: npm run build
