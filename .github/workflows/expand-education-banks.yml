name: Expand education banks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/general/education-bank-a.ts'
      - 'src/lib/general/education-bank-b.ts'
      - 'src/lib/general/education-bank-expanded.ts'
      - 'scripts/generate-education-banks.mjs'
      - 'scripts/validate-education-banks.mjs'
      - '.github/workflows/expand-education-banks.yml'

permissions:
  contents: write
  models: read

concurrency:
  group: education-bank-expansion
  cancel-in-progress: false

jobs:
  expand-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate 20 real questions per topic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-education-banks.mjs

      - name: Validate generated banks
        run: node scripts/validate-education-banks.mjs

      - name: Validate catalog
        run: npm run validate:catalog

      - name: Build
        run: npm run build

      - name: Commit verified banks to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/general/education-bank-a.ts src/lib/general/education-bank-b.ts
          if git diff --cached --quiet; then
            echo "No bank changes to commit."
            exit 0
          fi
          git commit -m "feat(education): expand every test bank to 20 unique questions"
          git push origin HEAD:main
