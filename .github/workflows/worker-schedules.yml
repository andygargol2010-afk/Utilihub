name: UtiliHub worker schedules

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker to run
        required: true
        default: manager
        type: choice
        options: [technical, innovator, retention, curator, manager]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: utilihub-worker-${{ github.event.schedule || inputs.worker || 'manual' }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  technical:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.worker == 'technical' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run agent:run -- technical
      - run: npm run lint
      - name: Create worker PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-worker-pr.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utilihub-technical-${{ github.run_id }}
          path: .agent/reports/
          if-no-files-found: warn
          retention-days: 14

  innovator:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.worker == 'innovator' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run agent:run -- innovator
      - run: npm run validate:catalog
      - run: npm run build
      - name: Create worker PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-worker-pr.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utilihub-innovator-${{ github.run_id }}
          path: .agent/reports/
          if-no-files-found: warn
          retention-days: 14

  retention:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.worker == 'retention' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run agent:run -- retention
      - run: npm run build
      - name: Create worker PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-worker-pr.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utilihub-retention-${{ github.run_id }}
          path: .agent/reports/
          if-no-files-found: warn
          retention-days: 14

  curator:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.worker == 'curator' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run agent:run -- curator
      - run: node scripts/validate-education-banks.mjs
      - name: Create worker PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-worker-pr.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utilihub-curator-${{ github.run_id }}
          path: .agent/reports/
          if-no-files-found: warn
          retention-days: 14

  manager:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.worker == 'manager' || github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run agent:run
      - run: npm run agent:self-improve
      - run: npm run lint
      - run: npm run validate:catalog
      - run: npm run build
      - name: Create worker PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-worker-pr.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utilihub-manager-${{ github.run_id }}
          path: .agent/reports/
          if-no-files-found: warn
          retention-days: 14
