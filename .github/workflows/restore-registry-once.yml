name: restore-registry-once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
          fetch-depth: 0
      - name: Restore registry from known-good commit
        run: |
          set -euo pipefail
          # Known good full registry (~24kB) from 9a74b5f
          git show 9a74b5f51ea50f5d16b4abdb75873ec8eeaf41e3:src/components/general/registry.tsx > src/components/general/registry.tsx
          BYTES=$(wc -c < src/components/general/registry.tsx)
          echo "Restored registry bytes=$BYTES"
          if [ "$BYTES" -lt 20000 ]; then
            echo "Restore too small"
            exit 1
          fi
          head -c 80 src/components/general/registry.tsx
          echo
      - name: Commit and push
        run: |
          git config user.name "andygargol2010-afk"
          git config user.email "andygargol2010@gmail.com"
          git add src/components/general/registry.tsx
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "fix(cat): restore full general/registry.tsx from 9a74b5f (tools UI blank)"
          git push origin HEAD:fix/spanish-complete
