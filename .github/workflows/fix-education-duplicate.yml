name: One-time education warning fix
on:
  push:
    branches: [feat/catalog-expansion]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: remove duplicate education key') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate energia key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/general/education-engine.ts')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          seen = False
          out = []
          for line in lines:
              if line.startswith(' energia:['):
                  if seen:
                      continue
                  seen = True
              out.append(line)
          p.write_text(''.join(out), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            exit 0
          fi
          git add src/lib/general/education-engine.ts
          git commit -m 'fix: remove duplicate education key'
          git push
