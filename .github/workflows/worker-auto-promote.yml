name: Promote worker changes

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: worker-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promote:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'agent/worker/') &&
      contains(github.event.pull_request.body, '<!-- WORKER_GENERATED_PR -->')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for every PR check and Preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: timeout 1800 gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --watch --fail-fast

      - name: Report worker PR ready for supervised review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Todas las comprobaciones y el Preview han terminado correctamente. El PR queda listo para revisión y merge supervisados; no se promociona automáticamente a main."
