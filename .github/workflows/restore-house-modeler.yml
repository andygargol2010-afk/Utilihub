name: Restore HouseModeler3D
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore HouseModeler3D from ed40dbc (cirrus / full graphics)
        run: |
          set -euo pipefail
          # Last good detailed modeler before the simplified/placeholder overwrite
          GOOD=ed40dbc09f5a0e4490b30f0b2acf22cc98ab526c
          git checkout "$GOOD" -- src/components/general/HouseModeler3D.tsx
          # Remove emergency split modules if present
          rm -f src/components/general/house-modeler-lib.ts \
                src/components/general/house-modeler-textures.ts \
                src/components/general/house-modeler-glyph.tsx \
                docs/test-upload-size.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --staged --quiet; then
            echo "Nothing to commit — already restored"
            exit 0
          fi
          git commit -m "restore: HouseModeler3D from ed40dbc (full detailed graphics)"
          git push origin HEAD:fix/spanish-complete
