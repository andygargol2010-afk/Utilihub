name: Restore HouseModeler3D
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix door-finish JSX imbalance
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/general/HouseModeler3D.tsx")
          t = p.read_text()
          # 1) Wrap orphan door-finish panel with the same conditional as wall/roof
          old_open = '''          ))}

            <div className="rounded-xl border border-border bg-background/80 p-2" role="group" aria-label={labels.doorFinish}>
'''
          new_open = '''          ))}

          {(tool === "door" || selectedKind === "door") && (
            <div className="rounded-xl border border-border bg-background/80 p-2" role="group" aria-label={labels.doorFinish}>
'''
          if old_open not in t:
              raise SystemExit("door-finish open marker not found")
          t = t.replace(old_open, new_open, 1)
          # 2) Remove duplicate empty door conditional before isFullscreen
          old_orphan = '''          {(tool === "door" || selectedKind === "door") && (

          {isFullscreen && (
'''
          new_orphan = '''          {isFullscreen && (
'''
          if old_orphan not in t:
              raise SystemExit("orphan door conditional not found")
          t = t.replace(old_orphan, new_orphan, 1)
          p.write_text(t)
          print("JSX fixed: door finish wrapped; orphan conditional removed")
          PY
          # Sanity: balanced-ish check for the two markers
          grep -n 'tool === "door" || selectedKind === "door"' src/components/general/HouseModeler3D.tsx
          git config user.name "andygargol2010-afk"
          git config user.email "andygargol2010@gmail.com"
          git add src/components/general/HouseModeler3D.tsx
          git status
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix(house-modeler): balance door-finish JSX so vite build passes"
          git push origin HEAD:fix/spanish-complete
