name: Restore HouseModeler3D
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and fix
        run: |
          set -euo pipefail
          GOOD=9e7cfe5f989adf28455adb0fb164c6d2e7c6e3ef
          git log --oneline -1 "$GOOD"
          git checkout "$GOOD" -- src/components/general/HouseModeler3D.tsx
          rm -f src/components/general/house-modeler-lib.ts src/components/general/house-modeler-textures.ts src/components/general/house-modeler-glyph.tsx
          python3 -c "
          from pathlib import Path
          p = Path('src/components/general/HouseModeler3D.tsx')
          t = p.read_text()
          old = '''      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.rotation.x = -Math.PI / 2;
      rim.position.y = 0.012;
      rim.receiveShadow = true;
      scene.add(rim);'''
          new = '''      const padRim = new THREE.Mesh(rimGeo, rimMat);
      padRim.rotation.x = -Math.PI / 2;
      padRim.position.y = 0.012;
      padRim.receiveShadow = true;
      scene.add(padRim);'''
          assert old in t, 'pad rim block missing'
          p.write_text(t.replace(old, new, 1))
          print('renamed mesh rim -> padRim')
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "restore: HouseModeler3D from 9e7cfe5 + fix rim redeclaration"
          git push origin HEAD:fix/spanish-complete
