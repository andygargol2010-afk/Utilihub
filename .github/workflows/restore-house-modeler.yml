name: Restore HouseModeler3D
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore monolith from a4c81b5
        run: |
          set -euo pipefail
          GOOD=a4c81b5ec28ea4a01e4731752c30c08fee19795b
          echo "Restoring from $GOOD"
          git log --oneline -1 "$GOOD"
          git checkout "$GOOD" -- src/components/general/HouseModeler3D.tsx
          LINES=$(wc -l < src/components/general/HouseModeler3D.tsx)
          echo "Restored lines: $LINES"
          test "$LINES" -gt 4000 || { echo "ERROR: file too small ($LINES lines)"; exit 1; }
          grep -q partFrozen src/components/general/HouseModeler3D.tsx
          grep -q paintPlaster src/components/general/HouseModeler3D.tsx
          grep -q SceneLayer src/components/general/HouseModeler3D.tsx
          git config user.name "andygargol2010-afk"
          git config user.email "andygargol2010@gmail.com"
          git add src/components/general/HouseModeler3D.tsx
          git status
          if git diff --staged --quiet; then
            echo "Nothing to commit — already restored?"
            exit 0
          fi
          git commit -m "fix(house-modeler): restore full monolith from a4c81b5 after accidental wipe"
          git push origin HEAD:fix/spanish-complete
