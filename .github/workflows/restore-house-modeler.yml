name: Restore HouseModeler3D
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore HouseModeler3D from 9e7cfe5
        run: |
          set -euo pipefail
          GOOD=9e7cfe5f989adf28455adb0fb164c6d2e7c6e3ef
          echo "Restoring from:"
          git log --oneline -1 "$GOOD"
          git checkout "$GOOD" -- src/components/general/HouseModeler3D.tsx
          rm -f src/components/general/house-modeler-lib.ts \
                src/components/general/house-modeler-textures.ts \
                src/components/general/house-modeler-glyph.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --staged --quiet; then
            echo "Nothing to commit — already restored"
            exit 0
          fi
          git commit -m "restore: HouseModeler3D from 9e7cfe5 (full detailed graphics)"
          git push origin HEAD:fix/spanish-complete
