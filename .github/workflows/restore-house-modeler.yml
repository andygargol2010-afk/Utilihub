name: Restore HouseModeler3D
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore good HouseModeler3D and remove split modules
        run: |
          set -euo pipefail
          git checkout 9e7cfe5f989adf28455adb0fb164c6d2e7c6e3ef -- src/components/general/HouseModeler3D.tsx
          rm -f src/components/general/house-modeler-lib.ts \
                src/components/general/house-modeler-textures.ts \
                src/components/general/house-modeler-glyph.tsx \
                docs/test-upload-size.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "restore: HouseModeler3D from 9e7cfe5 (good detailed version)"
          git push origin HEAD:fix/spanish-complete
