name: Build UtiliHub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/split-education-engine.mjs
      - run: npm install
      - run: npm run build
      - name: Commit generated education split
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- src/lib/general/education-engine.ts src/lib/general/education-bank-a.ts src/lib/general/education-bank-b.ts; then
            echo "Education engine already split."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/general/education-engine.ts src/lib/general/education-bank-a.ts src/lib/general/education-bank-b.ts
          git commit -m "refactor: split education engine"
          git push
# Trigger production deployment for the latest main commit
