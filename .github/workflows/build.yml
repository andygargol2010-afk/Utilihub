name: Build UtiliHub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/split-education-engine.mjs
      - run: npm install --no-audit --no-fund

      - name: Expand education banks
        if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'feat(education): expand every test bank') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-education-banks.mjs

      - name: Validate education banks
        if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'feat(education): expand every test bank') }}
        run: node scripts/validate-education-banks.mjs

      - name: Validate education runtime
        if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'feat(education): expand every test bank') }}
        run: node scripts/test-education-engine.mjs

      - run: npm run validate:catalog
      - run: npm run build

      - name: Commit verified education banks
        if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'feat(education): expand every test bank') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/general/education-bank-a.ts src/lib/general/education-bank-b.ts
          if git diff --cached --quiet; then
            echo "No education bank changes."
            exit 0
          fi
          git commit -m "feat(education): expand every test bank to 20 unique questions"
          git push origin HEAD:main
