name: Write PixeliHub UI from b64 parts
on:
  workflow_dispatch:
  push:
    paths:
      - ".agent/backups/px-ui.b64.1"
      - ".agent/backups/px-ui.b64.8"
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
      - name: Decode
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = [Path(f".agent/backups/px-ui.b64.{i}").read_text().strip() for i in range(1, 9)]
          data = base64.b64decode("".join(parts))
          assert b"PIXELIHUB" in data and b"brushSize" in data
          Path("src/components/general/PixelArtStudio.tsx").write_bytes(data)
          print("wrote", len(data))
          PY
      - name: Commit
        run: |
          git config user.name "andygargol2010-afk"
          git config user.email "andygargol2010@gmail.com"
          git add src/components/general/PixelArtStudio.tsx
          if git diff --cached --quiet; then echo none; exit 0; fi
          git commit -m "feat(pixelihub): brush size 1–8px for pencil and eraser (roadmap item 4)"
          git push
