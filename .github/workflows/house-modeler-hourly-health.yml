# Hourly health for 3D House Modeler (Advanced tools).
# Does NOT invent product features — that is the Grok house-modeler automation.
# This workflow only: measure monolith integrity, auto-restore if wiped, report.
name: HouseModeler hourly health

on:
  schedule:
    # Every hour at minute 20 (offset from other crons)
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      force_restore:
        description: "Force restore from known-good even if size OK"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: house-modeler-hourly-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix/spanish-complete
        uses: actions/checkout@v4
        with:
          ref: fix/spanish-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect HouseModeler3D monolith
        id: inspect
        run: |
          set -euo pipefail
          F=src/components/general/HouseModeler3D.tsx
          if [ ! -f "$F" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "bytes=0" >> "$GITHUB_OUTPUT"
            echo "lines=0" >> "$GITHUB_OUTPUT"
            echo "wiped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BYTES=$(wc -c < "$F" | tr -d ' ')
          LINES=$(wc -l < "$F" | tr -d ' ')
          WIPED=false
          if [ "$BYTES" -lt 120000 ] || [ "$LINES" -lt 3500 ]; then
            WIPED=true
          fi
          if ! grep -q 'paintPlaster' "$F" || ! grep -q 'paintTimber' "$F"; then
            WIPED=true
          fi
          if grep -qE 'PLACEHOLDER|REPLACE_ME|minimal modeler' "$F"; then
            WIPED=true
          fi
          echo "missing=false" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "wiped=$WIPED" >> "$GITHUB_OUTPUT"
          echo "HouseModeler3D: $BYTES bytes, $LINES lines, wiped=$WIPED"

      - name: Restore from known-good if wiped
        if: steps.inspect.outputs.wiped == 'true' || inputs.force_restore == 'true'
        run: |
          set -euo pipefail
          GOOD=a074b7a6c89b530e4c4655bc9711c70053c495d8
          echo "Restoring HouseModeler3D.tsx from $GOOD"
          git checkout "$GOOD" -- src/components/general/HouseModeler3D.tsx
          rm -f src/components/general/house-modeler-materials.ts \
                src/components/general/house-modeler-meshes.tsx \
                src/components/general/house-modeler-meshes-glyph.tsx \
                src/components/general/house-modeler-types.ts \
                src/components/general/house-modeler-textures.ts \
                src/components/general/house-modeler-textures-a.ts \
                src/components/general/house-modeler-textures-b.ts 2>/dev/null || true
          BYTES=$(wc -c < src/components/general/HouseModeler3D.tsx | tr -d ' ')
          LINES=$(wc -l < src/components/general/HouseModeler3D.tsx | tr -d ' ')
          echo "Restored: $BYTES bytes, $LINES lines"
          if [ "$BYTES" -lt 120000 ]; then
            echo "::error::Restore produced file too small ($BYTES)"
            exit 1
          fi
          git config user.name "andygargol2010-afk"
          git config user.email "andygargol2010@gmail.com"
          git add src/components/general/HouseModeler3D.tsx
          git add -u src/components/general/house-modeler-*.ts src/components/general/house-modeler-*.tsx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit after restore"
          else
            git commit -m "fix(house-modeler): auto-restore monolith (hourly health Actions)"
            git push origin HEAD:fix/spanish-complete
          fi

      - name: Write health report
        run: |
          set -euo pipefail
          mkdir -p .agent/reports
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BYTES="${{ steps.inspect.outputs.bytes }}"
          LINES="${{ steps.inspect.outputs.lines }}"
          WIPED="${{ steps.inspect.outputs.wiped }}"
          F=src/components/general/HouseModeler3D.tsx
          if [ -f "$F" ]; then
            BYTES=$(wc -c < "$F" | tr -d ' ')
            LINES=$(wc -l < "$F" | tr -d ' ')
          fi
          cat > ".agent/reports/house-modeler-health-${TS}.json" << JSON
          {
            "schema_version": 1,
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "house-modeler-hourly-health",
            "branch": "fix/spanish-complete",
            "path": "src/components/general/HouseModeler3D.tsx",
            "bytes": ${BYTES:-0},
            "lines": ${LINES:-0},
            "was_wiped": ${WIPED:-false},
            "catalog": {
              "slug": "modelador-casas-3d",
              "category": "herramientas-avanzadas",
              "featured_home": true
            },
            "note": "Product improvements remain with Grok house-modeler automation; this job only protects the monolith."
          }
          JSON
          echo "Report written"
          cat ".agent/reports/house-modeler-health-${TS}.json"

      - name: Commit report (best-effort)
        if: always()
        run: |
          set -euo pipefail
          git config user.name "andygargol2010-afk"
          git config user.email "andygargol2010@gmail.com"
          git add .agent/reports/house-modeler-health-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report commit"
          else
            git commit -m "docs(agent): house-modeler hourly health report" || true
            git push origin HEAD:fix/spanish-complete || echo "Push report skipped (non-fatal)"
          fi
