    C 14 20 24 10 40 10
    C 48 10 54 14 54 22
    L 54 28
    C 54 32 51 34 47 34
    L 40 34
    C 32 34 28 38 28 46
    L 28 62
    C 28 74 36 84 50 84
    L 64 84
    L 64 102
    C 40 102 14 88 14 64
    Z"/>

  <!-- Right blue rounded arm -->
  <path fill="url(#b)" d="
    M 114 36
    C 114 20 104 10 88 10
    C 80 10 74 14 74 22
    L 74 28
    C 74 32 77 34 81 34
    L 88 34
    C 96 34 100 38 100 46
    L 100 62
    C 100 74 92 84 78 84
    L 64 84
    L 64 102
    C 88 102 114 88 114 64
    Z"/>

  <!-- Left white circle + wrench -->
  <circle cx="34" cy="32" r="14.5" fill="#fff"/>
  <g transform="translate(34 32)" fill="#16a34a">
    <!-- simplified clean wrench -->
    <path d="M-7.5-8.2c-3.3 0-5.8 2.5-5.8 5.8 0 2.6 1.7 4.8 4.1 5.5v2.4h3.3V3.1c1.1-.2 2.1-.9 2.7-1.7l2.3 1.3 1.6-2.8-2.5-1.4c.2-.5.3-1.1.3-1.7 0-3.3-2.5-5.8-5.8-5.8zm0 3.3c1.4 0 2.5 1.1 2.5 2.5s-1.1 2.5-2.5 2.5-2.5-1.1-2.5-2.5 1.1-2.5 2.5-2.5z"/>
    <rect x="-1" y="-1.6" width="13.5" height="3.6" rx="1.8" transform="rotate(32)"/>
  </g>

  <!-- Right white circle + share -->
  <circle cx="94" cy="32" r="14.5" fill="#fff"/>
  <g transform="translate(94 32)" fill="#2563eb">
    <circle cx="0" cy="-6.5" r="3.3"/>
    <circle cx="-6.8" cy="5.2" r="3.3"/>
    <circle cx="6.8" cy="5.2" r="3.3"/>
    <path d="M0-3.3L-4.9 3M0-3.3L4.9 3" stroke="#2563eb" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bottom circle (front) -->
  <circle cx="64" cy="100" r="20.5" fill="url(#c)"/>
  <circle cx="64" cy="100" r="14" fill="#fff"/>
  <circle cx="64" cy="100" r="8.2" fill="#22c55e"/>
