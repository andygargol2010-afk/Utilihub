    C56 24 58 22 58 18
    L58 16
    C58 12 54 10 48 10
    L30 10
    C22 10 18 14 18 20Z"/>

  <!-- Right blue half of U -->
  <path fill="url(#b)" d="
    M110 20
    C116 20 120 26 120 34
    L120 68
    C120 86 106 102 80 102
    L64 102
    L64 86
    C64 82 67 80 71 80
    L80 80
    C94 80 102 72 102 58
    L102 36
