  <!-- Left white circle + wrench -->
  <circle cx="33" cy="33" r="15" fill="#fff"/>
  <g transform="translate(33 33)" fill="#16a34a">
    <path d="M-8-9c-3.5 0-6 2.6-6 6s2 5.2 4.5 5.8v2.6h3.5v-2.8c1.2-.25 2.2-1 2.8-1.9l2.4 1.4 1.7-2.9-2.6-1.5c.25-.55.35-1.15.35-1.8 0-3.4-2.5-6-6-6zm0 3.5c1.4 0 2.5 1.1 2.5 2.5s-1.1 2.5-2.5 2.5-2.5-1.1-2.5-2.5 1.1-2.5 2.5-2.5z"/>
    <rect x="-1.2" y="-1.8" width="14" height="4" rx="2" transform="rotate(30)"/>
  </g>

  <!-- Right white circle + share -->
  <circle cx="95" cy="33" r="15" fill="#fff"/>
  <g transform="translate(95 33)" fill="#2563eb">
    <circle cx="0" cy="-6.8" r="3.5"/>
