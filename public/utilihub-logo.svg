<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">UtiliHub</title>
  <defs>
    <linearGradient id="leftGrad" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#9AFFC0"/>
      <stop offset="35%" stop-color="#3EF0B0"/>
      <stop offset="100%" stop-color="#00C9A0"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0.4" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#6EC8FF"/>
      <stop offset="40%" stop-color="#3A8BFF"/>
      <stop offset="100%" stop-color="#1B55F5"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3FF"/>
      <stop offset="100%" stop-color="#1E5BFF"/>
    </linearGradient>
  </defs>
  <!-- LEFT ARM -->
  <path fill="url(#leftGrad)" d="
    M 42 28
    C 62 22, 88 30, 92 58
    L 92 128
    C 90 148, 78 158, 62 160
    C 48 162, 36 154, 32 138
    L 32 62
    C 30 42, 34 30, 42 28
    Z"/>
  <!-- left inner circle -->
  <circle cx="62" cy="72" r="22" fill="#0B2A3A" opacity="0.15"/>
  <circle cx="62" cy="72" r="19" fill="#FFFFFF"/>
  <!-- wrench icon -->
  <g transform="translate(62,72) scale(0.95)">
    <path fill="#1A4DFF" d="
      M -10 -8
      C -6 -14, 2 -14, 6 -8
      L 4 -5
      C 2 -8, -2 -8, -4 -5
      L 6 5
      L 9 2
      L 12 5
      L 9 8
      L 14 13
      L 11 16
      L 6 11
      L 3 14
      L 0 11
      L 3 8
      L -7 -2
      C -9 0, -10 4, -8 7
      L -12 5
      C -15 0, -14 -6, -10 -8
      Z"/>
  </g>
  <!-- RIGHT ARM -->
  <path fill="url(#rightGrad)" d="
    M 158 28
    C 138 22, 112 30, 108 58
    L 108 128
    C 110 148, 122 158, 138 160
    C 152 162, 164 154, 168 138
    L 168 62
    C 170 42, 166 30, 158 28
    Z"/>
  <!-- right inner circle -->
  <circle cx="138" cy="72" r="22" fill="#061530" opacity="0.12"/>
  <circle cx="138" cy="72" r="19" fill="#FFFFFF"/>
  <!-- share / network icon -->
  <g fill="#1A4DFF" stroke="#1A4DFF" stroke-width="2.4" stroke-linecap="round">
    <circle cx="130" cy="64" r="4.2" stroke="none"/>
    <circle cx="148" cy="62" r="4.2" stroke="none"/>
    <circle cx="144" cy="82" r="4.2" stroke="none"/>
    <path fill="none" d="M133.5 66.5 L144.5 63.5"/>
    <path fill="none" d="M133.5 68 L141.5 78"/>
  </g>
  <!-- BOTTOM NODE -->
  <circle cx="100" cy="158" r="32" fill="url(#ringGrad)"/>
  <circle cx="100" cy="158" r="22" fill="#FFFFFF"/>
  <circle cx="100" cy="158" r="13" fill="#2EE6A6"/>
  <!-- soft ribbon joins into node -->
  <path fill="url(#leftGrad)" opacity="0.92" d="
    M 40 130
    C 48 150, 68 168, 100 168
    C 88 168, 72 160, 62 148
    C 54 138, 46 128, 40 130
    Z"/>
  <path fill="url(#rightGrad)" opacity="0.92" d="
    M 160 130
    C 152 150, 132 168, 100 168
    C 112 168, 128 160, 138 148
    C 146 138, 154 128, 160 130
    Z"/>
</svg>
